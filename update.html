<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
  <title>Обновление AnimeOn</title>
  <link rel="stylesheet" href="update.css" />
</head>
<body>
  <div class="upd-card">
    <header class="ud-head" id="drag">
      <img src="assets/logo.png" alt="" draggable="false">
      <div class="ud-titles">
        <b>Обновление</b>
        <i id="ud-version"></i>
      </div>
      <button id="btn-close" title="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="ud-body">
      <div class="ud-label">Что нового</div>
      <div class="ud-notes" id="ud-notes">Загружаю описание…</div>
    </div>

    <footer class="ud-foot">
      <div class="ud-progress hidden" id="ud-progress">
        <div class="udp-bar"><i id="udp-fill"></i></div>
        <span class="udp-pct" id="udp-pct">0%</span>
      </div>
      <p class="ud-status" id="ud-status"></p>
      <div class="ud-btns">
        <button class="ghost-btn accent" id="btn-download">Скачать и обновить</button>
        <button class="ghost-btn hidden" id="btn-later">Позже</button>
      </div>
    </footer>
  </div>

  <script src="update.js"></script>
</body>
</html>
