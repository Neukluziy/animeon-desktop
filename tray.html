<!DOCTYPE html>
<html lang="ru" class="tray-menu">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'">
  <title>AnimeOn</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tray.css">
</head>
<body class="tray-menu">
  <div class="tm-card">
    <div class="tm-head">
      <div class="tm-brand">
        <div class="tm-logo"><img src="assets/logo.png" alt="" draggable="false"></div>
        <div class="tm-title"><b>Anime<span>ON</span></b><small id="tm-status">Работает</small></div>
      </div>
      <i class="tm-ver" id="tm-ver"></i>
    </div>
    <div class="tm-actions">
      <button class="tm-item tm-main" id="tm-open"><span class="tm-ico"><svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M6 10v10h12V10"/></svg></span><span>Открыть</span></button>
      <button class="tm-item" id="tm-settings"><span class="tm-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.3 7.3 0 0 0 0-3l2-1.1-2-3.4-2.1.8a7.5 7.5 0 0 0-2.6-1.5L14 3h-4l-.3 2.3a7.5 7.5 0 0 0-2.6 1.5L5 6 3 9.4l2 1.1a7.3 7.3 0 0 0 0 3l-2 1.1L5 18l2.1-.8a7.5 7.5 0 0 0 2.6 1.5L10 21h4l.3-2.3a7.5 7.5 0 0 0 2.6-1.5L19 18l2-3.4-2-1.1z"/></svg></span><span>Настройки</span></button>
      <button class="tm-item" id="tm-hide"><span class="tm-ico"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></span><span>Скрыть окно</span></button>
      <button class="tm-item tm-quit" id="tm-quit"><span class="tm-ico"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span>Выйти</span></button>
    </div>
  </div>
  <script src="tray.js"></script>
</body>
</html>
