<!DOCTYPE html>
<html lang="ru" class="tray-menu">
<head>

  <title>AnimeOn</title>
  <link rel="stylesheet" href="style.css" />

<body class="tray-menu">

      <img src="assets/logo.png" alt="" draggable="false">
      <span>Anime<em>ON</em></span>
      <i class="tm-ver" id="tm-ver"></i>
    </div>
    <button class="tm-item" id="tm-open">
      <svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M6 10v10h12V10"/></svg>
      Открыть

    <button class="tm-item" id="tm-hide">
      <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
      Скрыть
    </button>
    <button class="tm-item" id="tm-settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Настройки
    </button>
    <div class="tm-sep"></div>
    <button class="tm-item danger" id="tm-quit">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      Выйти
    </button>
  </div>
  <script src="tray.js"></script>
</body>
</html>
